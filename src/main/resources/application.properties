spring.application.name=${SPRING_APPLICATION_NAME:hall}

# Configurações do H2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Habilitar o console do H2 (acessível via navegador)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${SPRING_H2_CONSOLE_PATH:/h2-console}

# Configurações do JPA
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.transaction.coordinator_class=${SPRING_JPA_PROPERTIES_HIBERNATE_TRANSACTION_COORDINATOR_CLASS:jdbc}

# Token JWT
api.security.token.secret=${JWT_SECRET:minhaChaveSecretaSuperSegura}
